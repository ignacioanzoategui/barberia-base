const firebaseConfig={

firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.database();let B=null,BOOK={};
const defs=["10:00","10:40","11:20","12:00","12:40","13:20","14:00","14:40","15:20","16:00","16:40","17:20","18:00","18:40","19:20"],days=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c])),slugify=v=>v.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
function loginUI(){
  document.getElementById("app").innerHTML=`

          <button id="login-btn" class="btn gold" style="width:100%;margin-top:14px" onclick="log()">Ingresar</button>

function showAuthMode(mode){
  const regBox=document.getElementById("auth-register");
  const loginBox=document.getElementById("auth-login");
  const regTab=document.getElementById("auth-tab-register");
  const loginTab=document.getElementById("auth-tab-login");
  if(mode==="login"){
    regBox.style.display="none";
    loginBox.style.display="block";
    regTab.classList.remove("primary");
    loginTab.classList.add("primary");
    setTimeout(()=>document.getElementById("le")?.focus(),50);
  }else{
    loginBox.style.display="none";
    regBox.style.display="block";
    loginTab.classList.remove("primary");
    regTab.classList.add("primary");
    setTimeout(()=>document.getElementById("rn")?.focus(),50);
  }
}

async function reg(){
  const n=document.getElementById("rn").value.trim();
  const p=document.getElementById("rp").value.trim();
  const e=document.getElementById("re").value.trim();
  const w=document.getElementById("rw").value;
  const rm=document.getElementById("rm");
  const btn=document.getElementById("register-btn");

  if(!n||!e||!w){
    rm.innerHTML='<p style="color:var(--r);margin-top:10px">Completá nombre, email y contraseña.</p>';
    return;
  }

  btn.disabled=true;
  btn.textContent="Creando cuenta...";

  try{
    const c=await auth.createUserWithEmailAndPassword(e,w);
    const uid=c.user.uid;
    const slug=(slugify(n)||"peluqueria")+"-"+uid.slice(0,6).toLowerCase();

    let weekly={};
    for(let d=0;d<7;d++) weekly[d]={closed:d===0,start:"10:00",end:"19:20"};

    const obj={
      name:n,phone:p,email:e,slug,description:"",
      createdAt:Date.now(),
      branches:{principal:{name:"Sucursal principal",address:"",active:true}},
      professionals:{},services:{},workTimes:defs,
      weeklyHours:weekly,closedDates:{},professionalAbsences:{}
    };

    await db.ref(`negocios/${uid}`).set(obj);

    // El perfil público mejora la página del cliente, pero NO debe impedir
    // entrar al panel si las Rules todavía no fueron actualizadas.
    try{ await syncPublic(uid,obj); }catch(publicErr){ console.warn("public profile:",publicErr); }

    await dashboard();
  }catch(err){
    let text="No se pudo crear la cuenta.";
    if(err.code==="auth/email-already-in-use") text="Ese correo ya está registrado. Probá con “Iniciar sesión”.";
    else if(err.code==="auth/weak-password") text="La contraseña debe tener al menos 6 caracteres.";
    else if(err.code==="auth/invalid-email") text="El correo ingresado no es válido.";
    else text+=" "+err.message;
    rm.innerHTML='<p style="color:var(--r);margin-top:10px">'+esc(text)+'</p>';
  }finally{
    btn.disabled=false;
    btn.textContent="Registrar barbería";
  }
}

async function log(){
  const lm=document.getElementById("lm");
  const btn=document.getElementById("login-btn");
  const email=document.getElementById("le").value.trim();
  const password=document.getElementById("lw").value;

  lm.innerHTML="";

  if(!email||!password){
    lm.innerHTML='<p style="color:var(--r);margin-top:10px">Ingresá correo y contraseña.</p>';
    return;
  }

  btn.disabled=true;
  btn.textContent="Ingresando...";

  try{
    await auth.signInWithEmailAndPassword(email,password);
    await dashboard();
  }catch(err){
    console.error(err);
    let text="No se pudo iniciar sesión.";
    if(["auth/invalid-login-credentials","auth/invalid-credential","auth/wrong-password","auth/user-not-found"].includes(err.code)){
      text="Correo o contraseña incorrectos.";
    }else if(err.code==="auth/too-many-requests"){
      text="Hubo demasiados intentos. Esperá unos minutos y volvé a probar.";
    }else if(err.code==="auth/network-request-failed"){
      text="No se pudo conectar con Firebase. Revisá tu conexión.";
    }
    lm.innerHTML='<p style="color:var(--r);margin-top:10px">'+esc(text)+'</p>';
  }finally{
    if(document.getElementById("login-btn")){
      btn.disabled=false;
      btn.textContent="Ingresar";
    }
  }
}

async function getBusiness(){const u=auth.currentUser;if(!u)return null;const s=await db.ref(`negocios/${u.uid}`).once("value");return s.exists()?{...s.val(),id:u.uid}:null}
function publicPayload(uid,o){return{ownerUid:uid,name:o.name||"",phone:o.phone||"",description:o.description||"",branches:o.branches||{},professionals:o.professionals||{},services:o.services||{},workTimes:o.workTimes||defs,weeklyHours:o.weeklyHours||{},closedDates:o.closedDates||{},professionalAbsences:o.professionalAbsences||{}}}
async function syncPublic(uid,obj){await db.ref(`publicProfiles/${obj.slug}`).set(publicPayload(uid,obj))}
async function refreshAndSync(){B=await getBusiness();if(B){try{await syncPublic(B.id,B)}catch(e){console.warn("sync public:",e)}}}
async function dashboard(){
  try{
    B=await getBusiness();

    if(!B){
      renderProfileRecovery();
      return;
    }

    BOOK=(await db.ref(`negocios/${B.id}/turnos`).once("value")).val()||{};

    // Primero mostramos el panel. Una falla del perfil público nunca bloquea el login.
    renderDash();

    syncPublic(B.id,B).catch(err=>{
      console.warn("No se pudo sincronizar el perfil público:",err);
    });
  }catch(err){
    console.error("dashboard error",err);
    document.getElementById("app").innerHTML=`
      <section class="wrap">
        <div class="card" style="max-width:650px;margin:50px auto">
          <div class="k">Error al cargar el panel</div>
          <div class="title" style="font-size:24px">La sesión inició, pero no pudimos leer los datos.</div>
          <p class="muted">Esto normalmente significa que las reglas de Realtime Database todavía no coinciden con esta versión.</p>
          <p style="color:var(--r);font-size:11px;margin-top:12px">${esc(err.message||"")}</p>
          <button class="btn" style="margin-top:14px" onclick="auth.signOut()">Cerrar sesión</button>
        </div>
      </section>`;
  }
}

        <button class="btn" style="width:100%;margin-top:8px" onclick="auth.signOut()">Cerrar sesión</button>

  }

  try{
    const slug=(slugify(n)||"peluqueria")+"-"+u.uid.slice(0,6).toLowerCase();
    let weekly={};
    for(let d=0;d<7;d++) weekly[d]={closed:d===0,start:"10:00",end:"19:20"};
    const obj={
      name:n,phone:p,email:u.email||"",slug,description:"",
      createdAt:Date.now(),
      branches:{principal:{name:"Sucursal principal",address:"",active:true}},
      professionals:{},services:{},workTimes:defs,
      weeklyHours:weekly,closedDates:{},professionalAbsences:{}
    };
    await db.ref(`negocios/${u.uid}`).set(obj);

}

function renderDash(){document.getElementById("app").innerHTML=`<section class="wrap"><div class="head"><div><div class="k">Panel del negocio</div><div class="title">${esc(B.name)}</div><p class="muted">${esc(B.email||"")}</p></div><div class="actions"><button class="btn" onclick="location.href='index.html?negocio=${B.slug}'">Ver página de clientes</button><button class="btn" onclick="auth.signOut()">Cerrar sesión</button></div></div><div class="stats"><div class="stat a"><small>Turnos activos</small><strong id="s1">0</strong></div><div class="stat"><small>Turnos hoy</small><strong id="s2">0</strong></div><div class="stat"><small>Clientes</small><strong id="s3">0</strong></div><div class="stat"><small>Ingresos</small><strong id="s4">$ 0</strong></div></div><div class="tabs"><button class="btn tab active" onclick="show('agenda',this)">Agenda</button><button class="btn tab" onclick="show('stats',this)">Estadísticas</button><button class="btn tab" onclick="show('hours',this)">Horarios</button><button class="btn tab" onclick="show('days',this)">Días no laborables</button><button class="btn tab" onclick="show('pros',this)">Profesionales</button><button class="btn tab" onclick="show('branches',this)">Sucursales</button><button class="btn tab" onclick="show('services',this)">Servicios</button><button class="btn tab" onclick="show('link',this)">Mi link</button></div>
<div id="agenda" class="panel active card"><div class="k">Recepción</div><div class="title" style="font-size:20px">Cuadro de turnos</div><p class="muted">Vas a ver espacios disponibles, reservados y ausencias.</p><div class="controls"><div class="field"><label>Sucursal</label><select id="ab" onchange="prosFilter();agendaGrid()">${branchOptions()}</select></div><div class="field"><label>Profesional</label><select id="ap" onchange="agendaGrid()"></select></div><div>
  <label style="display:block;font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--m);font-weight:900;margin-bottom:7px">Fecha</label>
  <div class="date-control">
    <button class="btn date-nav" onclick="moveAgendaDate(-1)" title="Día anterior">‹</button>
    <div class="field"><input id="ad" type="date" onkeydown="return false" onclick="this.showPicker&&this.showPicker()" onchange="updateAgendaDateLabel();agendaGrid()"></div>
    <button class="btn date-nav" onclick="moveAgendaDate(1)" title="Día siguiente">›</button>
  </div>
  <button class="btn today-btn" onclick="setAgendaToday()">Hoy</button>
  <div id="agenda-date-label" class="agenda-date-label"></div>
</div></div><div id="ag"></div></div>
<div id="stats" class="panel card"><div class="title" style="font-size:20px">Estadísticas</div><div id="extra" style="margin-top:14px"></div></div>
<div id="hours" class="panel card"><div class="title" style="font-size:20px">Horario semanal</div><p class="muted">Podés cerrar días o modificar apertura y cierre.</p><div id="week" class="schedule" style="margin-top:14px"></div><button class="btn gold" style="margin-top:14px" onclick="saveWeek()">Guardar horarios</button></div>
<div id="days" class="panel card"><div class="title" style="font-size:20px">Días no laborables y ausencias</div><div class="grid2"><div><div class="field"><label>Día cerrado</label><input id="cd" type="date" onkeydown="return false" onclick="this.showPicker&&this.showPicker()"></div><div class="field"><label>Motivo</label><input id="cr" placeholder="Feriado, vacaciones..."></div><button class="btn gold" onclick="closeDay()">Dar de baja el día</button><div id="cl"></div></div><div><div class="field"><label>Profesional ausente</label><select id="xp">${proOptions()}</select></div><div class="field"><label>Fecha</label><input id="xd" type="date" onkeydown="return false" onclick="this.showPicker&&this.showPicker()"></div><div class="field"><label>Motivo / aviso</label><input id="xr"></div><button class="btn gold" onclick="absence()">Marcar ausencia</button><div id="xl"></div></div></div></div>
<div id="pros" class="panel card">${prosPanel()}</div><div id="branches" class="panel card">${branchPanel()}</div><div id="services" class="panel card">${servicePanel()}</div><div id="link" class="panel card"><div class="title" style="font-size:20px">Link para clientes</div><p class="muted">Abre directamente esta peluquería.</p><div class="copy" style="margin-top:14px"><input id="plink" readonly><button class="btn primary" onclick="navigator.clipboard.writeText(document.getElementById('plink').value);alert('Link copiado')">Copiar</button></div></div></section>`;fillStats();weekUI();lists();prosFilter();document.getElementById("ad").value=localDateString();updateAgendaDateLabel();agendaGrid();document.getElementById("plink").value=location.origin+location.pathname.replace("negocios.html","index.html")+"?negocio="+B.slug}

function localDateString(d=new Date()){
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function updateAgendaDateLabel(){
  const input=document.getElementById("ad");
  const label=document.getElementById("agenda-date-label");
  if(!input||!label||!input.value)return;
  const d=new Date(input.value+"T12:00:00");
  label.textContent=d.toLocaleDateString("es-AR",{weekday:"long",day:"2-digit",month:"long",year:"numeric"});
}
function setAgendaToday(){
  const input=document.getElementById("ad");
  input.value=localDateString();
  updateAgendaDateLabel();
  agendaGrid();
}
function moveAgendaDate(delta){
  const input=document.getElementById("ad");
  const d=input.value?new Date(input.value+"T12:00:00"):new Date();
  d.setDate(d.getDate()+delta);
  input.value=localDateString(d);
  updateAgendaDateLabel();
  agendaGrid();
}

function show(id,b){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');b.classList.add('active')}
function branchOptions(){return Object.entries(B.branches||{}).filter(([,x])=>x.active!==false).map(([id,b])=>`<option value="${id}">${esc(b.name)}</option>`).join("")}
function proOptions(){return Object.entries(B.professionals||{}).filter(([,p])=>p.active!==false).map(([id,p])=>`<option value="${id}">${esc(p.name)}</option>`).join("")}
function fillStats(){const a=Object.values(BOOK).filter(x=>x.status!=="cancelled"),today=localDateString(),clients=new Set(a.map(x=>x.phone||x.patient)).size,m=a.reduce((q,x)=>q+Number(x.totalPrice||0),0);document.getElementById("s1").textContent=a.length;document.getElementById("s2").textContent=a.filter(x=>x.dateStr===today).length;document.getElementById("s3").textContent=clients;document.getElementById("s4").textContent="$ "+m.toLocaleString("es-AR");let sv={},pr={};a.forEach(x=>{sv[x.service]=(sv[x.service]||0)+1;let p=x.professionalName||x.barber||"—";pr[p]=(pr[p]||0)+1});let top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1])[0];document.getElementById("extra").innerHTML=`<div class="grid2"><div class="row"><div><b>Servicio más reservado</b><small>${esc(top(sv)?.[0]||"Sin datos")}</small></div><strong>${top(sv)?.[1]||0}</strong></div><div class="row"><div><b>Profesional con más turnos</b><small>${esc(top(pr)?.[0]||"Sin datos")}</small></div><strong>${top(pr)?.[1]||0}</strong></div></div>`}
function weekUI(){document.getElementById("week").innerHTML=days.map((n,i)=>{const c=B.weeklyHours?.[i]||{closed:false,start:"10:00",end:"19:20"};return `<div class="day"><b>${n}</b><label><input id="wc${i}" type="checkbox" ${c.closed?"checked":""}> Cerrado</label><input id="ws${i}" type="time" value="${c.start||"10:00"}"><input id="we${i}" type="time" value="${c.end||"19:20"}"></div>`}).join("")}
async function saveWeek(){let o={};for(let i=0;i<7;i++)o[i]={closed:document.getElementById("wc"+i).checked,start:document.getElementById("ws"+i).value,end:document.getElementById("we"+i).value};await db.ref(`negocios/${B.id}/weeklyHours`).set(o);await refreshAndSync();await dashboard()}
function allowed(d){const c=B.weeklyHours?.[new Date(d+"T12:00:00").getDay()];if(c?.closed)return[];let a=B.workTimes||defs;const M=t=>{const[h,m]=t.split(":").map(Number);return h*60+m};if(c?.start&&c?.end){const x=M(c.start),y=M(c.end);a=a.filter(t=>M(t)>=x&&M(t)<=y)}return a}
function prosFilter(){const branch=document.getElementById("ab").value;document.getElementById("ap").innerHTML='<option value="ALL">Todos</option>'+Object.entries(B.professionals||{}).filter(([,p])=>p.active!==false&&p.branchId===branch).map(([id,p])=>`<option value="${id}">${esc(p.name)}</option>`).join("")}
function agendaGrid(){const branch=document.getElementById("ab").value,pf=document.getElementById("ap").value,d=document.getElementById("ad").value;if(!d)return;if(B.closedDates?.[d]?.closed){document.getElementById("ag").innerHTML=`<div class="row"><div><b>Local cerrado</b><small>${esc(B.closedDates[d].reason||"Día no laborable")}</small></div><span class="badge br">Cerrado</span></div>`;return}const ps=Object.entries(B.professionals||{}).filter(([,p])=>p.active!==false&&p.branchId===branch).filter(([id])=>pf==="ALL"||id===pf);let rows="";ps.forEach(([pid,p])=>allowed(d).forEach(t=>{const absent=B.professionalAbsences?.[pid]?.[d]?.absent,b=Object.entries(BOOK).map(([key,x])=>({...x,key})).find(x=>x.status!=="cancelled"&&x.dateStr===d&&x.time===t&&(x.professionalId===pid||x.barber===p.name));if(absent)rows+=`<tr><td>${t}</td><td>${esc(p.name)}</td><td><span class="badge bm">Ausente</span></td><td colspan="5">${esc(B.professionalAbsences[pid][d].reason||"No trabaja")}</td><td>—</td></tr>`;else if(b)rows+=`<tr><td><b>${t}</b></td><td>${esc(p.name)}</td><td><span class="badge ba">Reservado</span></td><td><b>${esc(b.patient||"")}</b></td><td>${esc(b.phone||"")}</td><td>${esc(b.service||"")}</td><td>$ ${Number(b.totalPrice||0).toLocaleString("es-AR")}</td><td>${esc(b.branchName||"")}</td><td><button class="btn danger" onclick="cancelT('${b.key}')">Cancelar</button></td></tr>`;else rows+=`<tr><td><b>${t}</b></td><td>${esc(p.name)}</td><td><span class="badge bg">Disponible</span></td><td>—</td><td>—</td><td>—</td><td>—</td><td>${esc(B.branches?.[branch]?.name||"")}</td><td>Libre</td></tr>`}));document.getElementById("ag").innerHTML=`<div class="table-wrap"><table class="table"><thead><tr><th>Hora</th><th>Profesional</th><th>Estado</th><th>Cliente</th><th>Celular</th><th>Servicio</th><th>Total</th><th>Sucursal</th><th>Acción</th></tr></thead><tbody>${rows||'<tr><td colspan="9" style="text-align:center;padding:30px;color:#9699a1">No hay profesionales para este filtro.</td></tr>'}</tbody></table></div>`}
async function cancelT(k){if(confirm("¿Cancelar turno?")){await db.ref(`negocios/${B.id}/turnos/${k}`).update({status:"cancelled",cancelledAt:Date.now()});await dashboard()}}
function lists(){document.getElementById("cl").innerHTML=Object.entries(B.closedDates||{}).filter(([,x])=>x.closed).map(([d,x])=>`<div class="row"><div><b>${d}</b><small>${esc(x.reason||"")}</small></div><button class="btn danger" onclick="removeClosed('${d}')">Quitar</button></div>`).join("");let a=[];Object.entries(B.professionalAbsences||{}).forEach(([p,ds])=>Object.entries(ds||{}).forEach(([d,x])=>x.absent&&a.push([p,d,x])));document.getElementById("xl").innerHTML=a.map(([p,d,x])=>`<div class="row"><div><b>${esc(B.professionals?.[p]?.name||"")} · ${d}</b><small>${esc(x.reason||"")}</small></div><button class="btn danger" onclick="removeAbs('${p}','${d}')">Quitar</button></div>`).join("")}
async function closeDay(){const d=document.getElementById("cd").value;if(!d)return;await db.ref(`negocios/${B.id}/closedDates/${d}`).set({closed:true,reason:document.getElementById("cr").value.trim()});await refreshAndSync();await dashboard()}
async function removeClosed(d){await db.ref(`negocios/${B.id}/closedDates/${d}`).remove();await refreshAndSync();await dashboard()}
async function absence(){const p=document.getElementById("xp").value,d=document.getElementById("xd").value;if(!p||!d)return;await db.ref(`negocios/${B.id}/professionalAbsences/${p}/${d}`).set({absent:true,reason:document.getElementById("xr").value.trim()});await refreshAndSync();await dashboard()}
async function removeAbs(p,d){await db.ref(`negocios/${B.id}/professionalAbsences/${p}/${d}`).remove();await refreshAndSync();await dashboard()}
function prosPanel(){const opts=branchOptions(),r=Object.entries(B.professionals||{}).map(([id,p])=>`<div class="row"><div><b>${esc(p.name)}</b><small>${esc(B.branches?.[p.branchId]?.name||"")} · ${esc(p.specialty||"")}</small></div><div class="actions"><button class="btn ${p.active===false?"green":"danger"}" onclick="togglePro('${id}',${p.active===false?"true":"false"})">${p.active===false?"Activar":"Dar de baja"}</button><button class="btn" onclick="replacePro('${id}')">Reemplazar</button></div></div>`).join("");return `<div class="title" style="font-size:20px">Profesionales</div><div class="grid2"><div class="field"><label>Nombre</label><input id="pn"></div><div class="field"><label>Especialidad</label><input id="ps"></div></div><div class="field"><label>Sucursal</label><select id="pb">${opts}</select></div><button class="btn gold" onclick="addPro()">Agregar</button>${r}`}
async function addPro(){const n=document.getElementById("pn").value.trim(),b=document.getElementById("pb").value;if(!n||!b)return;await db.ref(`negocios/${B.id}/professionals`).push({name:n,specialty:document.getElementById("ps").value.trim(),branchId:b,active:true});await refreshAndSync();await dashboard()}
async function togglePro(id,val){await db.ref(`negocios/${B.id}/professionals/${id}`).update({active:val});await refreshAndSync();await dashboard()}
async function replacePro(id){const p=B.professionals[id],n=prompt("Nombre del reemplazo:",p.name);if(!n)return;const s=prompt("Especialidad:",p.specialty||"")||"";await db.ref(`negocios/${B.id}/professionals/${id}`).update({name:n,specialty:s,active:true,replacedAt:Date.now()});await refreshAndSync();await dashboard()}
function branchPanel(){const r=Object.entries(B.branches||{}).map(([id,b])=>`<div class="row"><div><b>${esc(b.name)}</b><small>${esc(b.address||"")}</small></div></div>`).join("");return `<div class="title" style="font-size:20px">Sucursales</div><div class="grid2"><div class="field"><label>Nombre</label><input id="bn"></div><div class="field"><label>Dirección</label><input id="ba"></div></div><button class="btn gold" onclick="addBranch()">Agregar</button>${r}`}
async function addBranch(){const n=document.getElementById("bn").value.trim();if(!n)return;await db.ref(`negocios/${B.id}/branches`).push({name:n,address:document.getElementById("ba").value.trim(),active:true});await refreshAndSync();await dashboard()}
function servicePanel(){const r=Object.entries(B.services||{}).map(([id,s])=>`<div class="row"><div><b>${esc(s.name)}</b><small>${s.duration||40} min · $ ${Number(s.price||0).toLocaleString("es-AR")}</small></div></div>`).join("");return `<div class="title" style="font-size:20px">Servicios</div><div class="grid2"><div class="field"><label>Nombre</label><input id="sn"></div><div class="field"><label>Precio</label><input id="sp" type="number"></div><div class="field"><label>Duración</label><input id="sdur" type="number" value="40"></div><div class="field"><label>Descripción</label><input id="sdesc"></div></div><button class="btn gold" onclick="addService()">Agregar</button>${r}`}
async function addService(){const n=document.getElementById("sn").value.trim();if(!n)return;await db.ref(`negocios/${B.id}/services`).push({name:n,price:Number(document.getElementById("sp").value||0),duration:Number(document.getElementById("sdur").value||40),description:document.getElementById("sdesc").value.trim(),active:true});await refreshAndSync();await dashboard()}
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter") return;
  if(document.activeElement?.id==="lw") log();
  if(document.activeElement?.id==="rw") reg();
});
auth.onAuthStateChanged(async u=>{if(u)await dashboard();else loginUI()});
</script></body></html>
