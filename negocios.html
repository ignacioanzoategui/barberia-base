.table-wrap{overflow:auto;border:1px solid var(--b);border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:950px}.table th{background:#151619;color:var(--m);font-size:9px;text-transform:uppercase;letter-spacing:1px;text-align:left;padding:11px}.table td{padding:12px 11px;border-top:1px solid rgba(255,255,255,.05);font-size:11px}.badge{display:inline-flex;padding:5px 8px;border-radius:7px;font-size:9px;font-weight:900}.bg{color:var(--g);background:rgba(105,211,155,.08)}.ba{color:var(--a);background:rgba(215,179,90,.1)}.br{color:var(--r);background:rgba(228,125,125,.08)}.bm{color:var(--m);background:#22242a}
@media(max-width:800px){.grid2{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
.auth{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:920px;margin:55px auto}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}.actions{display:flex;gap:8px;flex-wrap:wrap}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:14px}.tab.active{background:#fff;color:#000}.panel{display:none}.panel.active{display:block}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}.schedule{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{border:1px solid var(--b);border-radius:12px;padding:10px;background:#101113}.day input{width:100%;margin-top:7px;padding:8px;background:#0e0f11;color:#fff;border:1px solid var(--b);border-radius:8px}.day label{display:flex;gap:5px;align-items:center;color:var(--m);font-size:10px;margin-top:7px}.copy{display:flex;gap:8px}.copy input{flex:1}@media(max-width:900px){.controls{grid-template-columns:1fr}.schedule{grid-template-columns:repeat(2,1fr)}}@media(max-width:800px){.auth{grid-template-columns:1fr}}
</style></head><body><header><div class="nav"><div class="brand">TURNOS <span>PRO</span></div><a class="btn" href="index.html">Página pública</a></div></header><main id="app"></main><script>const firebaseConfig={
apiKey:"AIzaSyBX7l9fm8jvUUys2osiYquN0B5JZLgd2DI",
authDomain:"barberia-demo-22bb4.firebaseapp.com",
databaseURL:"https://barberia-demo-22bb4-default-rtdb.firebaseio.com",
projectId:"barberia-demo-22bb4",

messagingSenderId:"360287665229",
appId:"1:360287665229:web:b0c48af17c5dbec7fdb004"};firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.database();let B=null,BOOK={};const defs=["10:00","10:40","11:20","12:00","12:40","13:20","14:00","14:40","15:20","16:00","16:40","17:20","18:00","18:40","19:20"],days=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c])),slugify=v=>v.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
function loginUI(){app.innerHTML=`<section class="wrap"><div class="auth"><div class="card"><div class="k">Nueva peluquería</div><div class="title">Crear cuenta</div><div id="rm"></div><div class="field"><label>Nombre</label><input id="rn"></div><div class="field"><label>WhatsApp</label><input id="rp"></div><div class="field"><label>Email</label><input id="re" type="email"></div><div class="field"><label>Contraseña</label><input id="rw" type="password"></div><button class="btn primary" style="width:100%;margin-top:14px" onclick="reg()">Crear cuenta</button></div><div class="card"><div class="k">Acceso privado</div><div class="title">Iniciar sesión</div><div id="lm"></div><div class="field"><label>Email</label><input id="le" type="email"></div><div class="field"><label>Contraseña</label><input id="lw" type="password"></div><button class="btn gold" style="width:100%;margin-top:14px" onclick="log()">Ingresar</button></div></div></section>`}
async function reg(){let n=rn.value.trim(),p=rp.value.trim(),e=re.value.trim(),w=rw.value;if(!n||!e||!w)return rm.innerHTML='<p style="color:var(--r)">Completá nombre, email y contraseña.</p>';try{let c=await auth.createUserWithEmailAndPassword(e,w),uid=c.user.uid,all=(await db.ref("negocios").once("value")).val()||{},base=slugify(n)||"peluqueria",slug=base,i=2;while(Object.values(all).some(x=>x.slug===slug))slug=base+"-"+i++;let weekly={};for(let d=0;d<7;d++)weekly[d]={closed:d===0,start:"10:00",end:"19:20"};await db.ref("negocios/"+uid).set({name:n,phone:p,email:e,slug,createdAt:Date.now(),branches:{principal:{name:"Sucursal principal",address:"",active:true}},professionals:{},services:{},workTimes:defs,weeklyHours:weekly,closedDates:{},professionalAbsences:{}})}catch(e){rm.innerHTML='<p style="color:var(--r)">'+esc(e.message)+'</p>'}}
async function log(){try{await auth.signInWithEmailAndPassword(le.value.trim(),lw.value)}catch(e){lm.innerHTML='<p style="color:var(--r)">No se pudo iniciar sesión: '+esc(e.message)+'</p>'}}
async function loadB(){let u=auth.currentUser;if(!u)return null;let s=await db.ref("negocios/"+u.uid).once("value");return s.exists()?{...s.val(),id:u.uid}:null}
async function dash(){B=await loadB();if(!B)return loginUI();BOOK=(await db.ref(`negocios/${B.id}/turnos`).once("value")).val()||{};app.innerHTML=`<section class="wrap"><div class="head"><div><div class="k">Panel de negocio</div><div class="title">${esc(B.name)}</div><p class="muted">${esc(B.email||"")}</p></div><div class="actions"><button class="btn" onclick="location.href='index.html?negocio=${B.slug}'">Ver página de clientes</button><button class="btn" onclick="auth.signOut()">Cerrar sesión</button></div></div><div class="stats"><div class="stat a"><small>Turnos activos</small><strong id="s1">0</strong></div><div class="stat"><small>Turnos hoy</small><strong id="s2">0</strong></div><div class="stat"><small>Clientes</small><strong id="s3">0</strong></div><div class="stat"><small>Ingresos</small><strong id="s4">$ 0</strong></div></div><div class="tabs"><button class="btn tab active" onclick="show('agenda',this)">Agenda</button><button class="btn tab" onclick="show('stats',this)">Estadísticas</button><button class="btn tab" onclick="show('hours',this)">Horarios</button><button class="btn tab" onclick="show('days',this)">Días no laborables</button><button class="btn tab" onclick="show('pros',this)">Profesionales</button><button class="btn tab" onclick="show('branches',this)">Sucursales</button><button class="btn tab" onclick="show('services',this)">Servicios</button><button class="btn tab" onclick="show('link',this)">Mi link</button></div>
<div id="agenda" class="panel active card"><div class="k">Recepción</div><div class="title" style="font-size:20px">Cuadro de turnos</div><div class="controls"><div class="field"><label>Sucursal</label><select id="ab" onchange="prosFilter();agendaGrid()">${branchOptions()}</select></div><div class="field"><label>Profesional</label><select id="ap" onchange="agendaGrid()"></select></div><div class="field"><label>Fecha</label><input id="ad" type="date" onchange="agendaGrid()"></div></div><div id="ag"></div></div>
<div id="stats" class="panel card"><div class="title" style="font-size:20px">Estadísticas</div><div id="extra"></div></div>
<div id="hours" class="panel card"><div class="title" style="font-size:20px">Horario semanal</div><p class="muted">Cerrá días o cambiá apertura/cierre.</p><div id="week" class="schedule" style="margin-top:14px"></div><button class="btn gold" style="margin-top:14px" onclick="saveWeek()">Guardar horarios</button></div>
<div id="days" class="panel card"><div class="title" style="font-size:20px">Días no laborables y ausencias</div><div class="grid2"><div><div class="field"><label>Día cerrado</label><input id="cd" type="date"></div><div class="field"><label>Motivo</label><input id="cr"></div><button class="btn gold" onclick="closeDay()">Dar de baja el día</button><div id="cl"></div></div><div><div class="field"><label>Profesional ausente</label><select id="xp">${proOptions()}</select></div><div class="field"><label>Fecha</label><input id="xd" type="date"></div><div class="field"><label>Motivo / aviso</label><input id="xr"></div><button class="btn gold" onclick="absence()">Marcar ausencia</button><div id="xl"></div></div></div></div>
<div id="pros" class="panel card">${prosPanel()}</div><div id="branches" class="panel card">${branchPanel()}</div><div id="services" class="panel card">${servicePanel()}</div><div id="link" class="panel card"><div class="title" style="font-size:20px">Link para clientes</div><p class="muted">Compartí este enlace. Abre directamente tu peluquería.</p><div class="copy" style="margin-top:14px"><input id="plink" readonly><button class="btn primary" onclick="navigator.clipboard.writeText(plink.value);alert('Link copiado')">Copiar</button></div></div></section>`;stats();weekUI();lists();prosFilter();ad.value=new Date().toISOString().slice(0,10);agendaGrid();plink.value=location.origin+location.pathname.replace("negocios.html","index.html")+"?negocio="+B.slug}
function show(id,b){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');b.classList.add('active')}
function branchOptions(){return Object.entries(B.branches||{}).map(([id,b])=>`<option value="${id}">${esc(b.name)}</option>`).join("")}function proOptions(){return Object.entries(B.professionals||{}).map(([id,p])=>`<option value="${id}">${esc(p.name)}</option>`).join("")}
function stats(){let a=Object.values(BOOK).filter(x=>x.status!=="cancelled"),today=new Date().toISOString().slice(0,10),clients=new Set(a.map(x=>x.phone||x.patient)).size,m=a.reduce((q,x)=>q+Number(x.totalPrice||0),0);s1.textContent=a.length;s2.textContent=a.filter(x=>x.dateStr===today).length;s3.textContent=clients;s4.textContent="$ "+m.toLocaleString("es-AR");let sv={},pr={};a.forEach(x=>{sv[x.service]=(sv[x.service]||0)+1;let p=x.professionalName||x.barber||"—";pr[p]=(pr[p]||0)+1});let top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1])[0];extra.innerHTML=`<div class="grid2"><div class="row"><div><b>Servicio más reservado</b><small>${esc(top(sv)?.[0]||"Sin datos")}</small></div><strong>${top(sv)?.[1]||0}</strong></div><div class="row"><div><b>Profesional con más turnos</b><small>${esc(top(pr)?.[0]||"Sin datos")}</small></div><strong>${top(pr)?.[1]||0}</strong></div></div>`}
function weekUI(){week.innerHTML=days.map((n,i)=>{let c=B.weeklyHours?.[i]||{closed:false,start:"10:00",end:"19:20"};return `<div class="day"><b>${n}</b><label><input id="wc${i}" type="checkbox" ${c.closed?"checked":""}> Cerrado</label><input id="ws${i}" type="time" value="${c.start}"><input id="we${i}" type="time" value="${c.end}"></div>`}).join("")}
async function saveWeek(){let o={};for(let i=0;i<7;i++)o[i]={closed:document.getElementById("wc"+i).checked,start:document.getElementById("ws"+i).value,end:document.getElementById("we"+i).value};await db.ref(`negocios/${B.id}/weeklyHours`).set(o);alert("Horarios guardados");dash()}
function allowed(d){let c=B.weeklyHours?.[new Date(d+"T12:00:00").getDay()];if(c?.closed)return[];let a=B.workTimes||defs,M=t=>{let[h,m]=t.split(":").map(Number);return h*60+m};if(c?.start&&c?.end){let x=M(c.start),y=M(c.end);a=a.filter(t=>M(t)>=x&&M(t)<=y)}return a}
function prosFilter(){let branch=ab.value;ap.innerHTML='<option value="ALL">Todos</option>'+Object.entries(B.professionals||{}).filter(([,p])=>p.active!==false&&p.branchId===branch).map(([id,p])=>`<option value="${id}">${esc(p.name)}</option>`).join("")}
function agendaGrid(){let branch=ab.value,pf=ap.value,d=ad.value;if(!d)return;if(B.closedDates?.[d]?.closed){ag.innerHTML=`<div class="row"><div><b>Local cerrado</b><small>${esc(B.closedDates[d].reason||"Día no laborable")}</small></div><span class="badge br">Cerrado</span></div>`;return}let ps=Object.entries(B.professionals||{}).filter(([,p])=>p.active!==false&&p.branchId===branch&&(pf==="ALL"||true)).filter(([id])=>pf==="ALL"||id===pf),rows="";ps.forEach(([pid,p])=>allowed(d).forEach(t=>{let absent=B.professionalAbsences?.[pid]?.[d]?.absent,b=Object.entries(BOOK).map(([key,x])=>({...x,key})).find(x=>x.status!=="cancelled"&&x.dateStr===d&&x.time===t&&(x.professionalId===pid||x.barber===p.name));if(absent)rows+=`<tr><td>${t}</td><td>${esc(p.name)}</td><td><span class="badge bm">Ausente</span></td><td colspan="5">${esc(B.professionalAbsences[pid][d].reason||"No trabaja")}</td><td>—</td></tr>`;else if(b)rows+=`<tr><td><b>${t}</b></td><td>${esc(p.name)}</td><td><span class="badge ba">Reservado</span></td><td><b>${esc(b.patient||"")}</b></td><td>${esc(b.phone||"")}</td><td>${esc(b.service||"")}</td><td>$ ${Number(b.totalPrice||0).toLocaleString("es-AR")}</td><td>${esc(b.branchName||"")}</td><td><button class="btn danger" onclick="cancelT('${b.key}')">Cancelar</button></td></tr>`;else rows+=`<tr><td><b>${t}</b></td><td>${esc(p.name)}</td><td><span class="badge bg">Disponible</span></td><td>—</td><td>—</td><td>—</td><td>—</td><td>${esc(B.branches?.[branch]?.name||"")}</td><td>Libre</td></tr>`}));ag.innerHTML=`<div class="table-wrap"><table class="table"><thead><tr><th>Hora</th><th>Profesional</th><th>Estado</th><th>Cliente</th><th>Celular</th><th>Servicio</th><th>Total</th><th>Sucursal</th><th>Acción</th></tr></thead><tbody>${rows||'<tr><td colspan="9">Sin profesionales para este filtro.</td></tr>'}</tbody></table></div>`}
async function cancelT(k){if(confirm("¿Cancelar turno?")){await db.ref(`negocios/${B.id}/turnos/${k}`).update({status:"cancelled"});dash()}}
function lists(){cl.innerHTML=Object.entries(B.closedDates||{}).filter(([,x])=>x.closed).map(([d,x])=>`<div class="row"><div><b>${d}</b><small>${esc(x.reason||"")}</small></div><button class="btn danger" onclick="db.ref('negocios/${B.id}/closedDates/${d}').remove().then(dash)">Quitar</button></div>`).join("");let a=[];Object.entries(B.professionalAbsences||{}).forEach(([p,ds])=>Object.entries(ds||{}).forEach(([d,x])=>x.absent&&a.push([p,d,x])));xl.innerHTML=a.map(([p,d,x])=>`<div class="row"><div><b>${esc(B.professionals?.[p]?.name||"")} · ${d}</b><small>${esc(x.reason||"")}</small></div><button class="btn danger" onclick="db.ref('negocios/${B.id}/professionalAbsences/${p}/${d}').remove().then(dash)">Quitar</button></div>`).join("")}
async function closeDay(){if(cd.value){await db.ref(`negocios/${B.id}/closedDates/${cd.value}`).set({closed:true,reason:cr.value.trim()});dash()}}async function absence(){if(xp.value&&xd.value){await db.ref(`negocios/${B.id}/professionalAbsences/${xp.value}/${xd.value}`).set({absent:true,reason:xr.value.trim()});dash()}}
function prosPanel(){let o=branchOptions(),r=Object.entries(B.professionals||{}).map(([id,p])=>`<div class="row"><div><b>${esc(p.name)}</b><small>${esc(B.branches?.[p.branchId]?.name||"")} · ${esc(p.specialty||"")}</small></div><div><button class="btn ${p.active===false?"green":"danger"}" onclick="db.ref('negocios/${B.id}/professionals/${id}').update({active:${p.active===false}}).then(dash)">${p.active===false?"Activar":"Dar de baja"}</button> <button class="btn" onclick="replacePro('${id}')">Reemplazar</button></div></div>`).join("");return `<div class="title" style="font-size:20px">Profesionales</div><div class="grid2"><div class="field"><label>Nombre</label><input id="pn"></div><div class="field"><label>Especialidad</label><input id="ps"></div></div><div class="field"><label>Sucursal</label><select id="pb">${o}</select></div><button class="btn gold" onclick="addPro()">Agregar</button>${r}`}
async function addPro(){if(pn.value.trim()&&pb.value){await db.ref(`negocios/${B.id}/professionals`).push({name:pn.value.trim(),specialty:ps.value.trim(),branchId:pb.value,active:true});dash()}}async function replacePro(id){let p=B.professionals[id],n=prompt("Nombre del reemplazo:",p.name);if(n){let s=prompt("Especialidad:",p.specialty||"")||"";await db.ref(`negocios/${B.id}/professionals/${id}`).update({name:n,specialty:s,active:true,replacedAt:Date.now()});dash()}}
function branchPanel(){let r=Object.entries(B.branches||{}).map(([id,b])=>`<div class="row"><div><b>${esc(b.name)}</b><small>${esc(b.address||"")}</small></div></div>`).join("");return `<div class="title" style="font-size:20px">Sucursales</div><div class="grid2"><div class="field"><label>Nombre</label><input id="bn"></div><div class="field"><label>Dirección</label><input id="ba"></div></div><button class="btn gold" onclick="addBranch()">Agregar</button>${r}`}async function addBranch(){if(bn.value.trim()){await db.ref(`negocios/${B.id}/branches`).push({name:bn.value.trim(),address:ba.value.trim(),active:true});dash()}}
function servicePanel(){let r=Object.entries(B.services||{}).map(([id,s])=>`<div class="row"><div><b>${esc(s.name)}</b><small>${s.duration||40} min · $ ${Number(s.price||0).toLocaleString("es-AR")}</small></div></div>`).join("");return `<div class="title" style="font-size:20px">Servicios</div><div class="grid2"><div class="field"><label>Nombre</label><input id="sn"></div><div class="field"><label>Precio</label><input id="sp" type="number"></div><div class="field"><label>Duración</label><input id="sdur" type="number" value="40"></div><div class="field"><label>Descripción</label><input id="sdesc"></div></div><button class="btn gold" onclick="addService()">Agregar</button>${r}`}async function addService(){if(sn.value.trim()){await db.ref(`negocios/${B.id}/services`).push({name:sn.value.trim(),price:Number(sp.value||0),duration:Number(sdur.value||40),description:sdesc.value.trim(),active:true});dash()}}
auth.onAuthStateChanged(u=>u?dash():loginUI());
</script></body></html>
