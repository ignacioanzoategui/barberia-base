<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Turnos Pro | Panel para peluquerías</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{--bg:#0b0b0c;--surface:#111214;--surface2:#17181b;--border:#292b30;--text:#f7f7f5;--muted:#9699a1;--accent:#d7b35a;--green:#69d39b;--danger:#e47d7d}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(circle at 50% -10%,rgba(215,179,90,.07),transparent 32%),var(--bg);color:var(--text);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}
header{padding:15px 22px;border-bottom:1px solid #202228;background:rgba(10,10,11,.9);backdrop-filter:blur(16px);position:sticky;top:0;z-index:20}.nav{max-width:1220px;margin:auto;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:2px}.brand span{color:var(--accent)}.container{max-width:1220px;margin:auto;padding:34px 18px 70px}
.btn{border:1px solid var(--border);background:var(--surface2);color:var(--text);padding:10px 14px;border-radius:10px;font-size:12px;font-weight:800}.btn.primary{background:#fff;color:#000;border-color:#fff}.btn.gold{background:var(--accent);color:#111;border-color:var(--accent)}.btn.danger{color:var(--danger)}
.card{background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.2)}.authgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:900px;margin:55px auto}.kicker{font-size:10px;color:var(--accent);font-weight:900;letter-spacing:2px;text-transform:uppercase}.title{font-size:28px;font-weight:850;margin-top:5px}.muted{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}.field{margin-top:13px}.field label{display:block;font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:900;margin-bottom:7px}.field input,.field select{width:100%;padding:12px;background:#0e0f11;border:1px solid var(--border);color:#fff;border-radius:10px;outline:none}.field input:focus,.field select:focus{border-color:var(--accent)}
.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:20px}.actions{display:flex;gap:8px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}.stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px}.stat small{color:var(--muted);font-size:10px}.stat strong{display:block;font-size:24px;margin-top:4px}.stat.accent strong{color:var(--accent)}
.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:14px}.tab.active{background:#fff;color:#000}.panel{display:none}.panel.active{display:block}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:900px}.table th{background:#151619;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:1px;text-align:left;padding:11px}.table td{padding:12px 11px;border-top:1px solid rgba(255,255,255,.05);font-size:11px}.badge{display:inline-flex;padding:5px 8px;border-radius:7px;font-size:9px;font-weight:900}.badge.green{color:var(--green);background:rgba(105,211,155,.08)}.badge.gold{color:var(--accent);background:rgba(215,179,90,.1)}.badge.gray{color:var(--muted);background:#22242a}
.row-card{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px;border:1px solid var(--border);border-radius:11px;background:#101113;margin-top:8px}.row-card small{display:block;color:var(--muted);margin-top:3px}.inline{display:flex;gap:8px;align-items:end}.inline .field{flex:1}.error{color:var(--danger);font-size:11px;margin-top:10px}.success{color:var(--green);font-size:11px;margin-top:10px}.copybox{display:flex;gap:8px}.copybox input{flex:1}
@media(max-width:800px){.authgrid,.grid2{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.head{flex-direction:column}}
</style>
</head>
<body>
<header><div class="nav"><div class="brand">TURNOS <span>PRO</span></div><a class="btn" href="index.html" style="text-decoration:none">Página pública</a></div></header>
<main id="app"></main>
<script>
const firebaseConfig={
  apiKey:"AIzaSyBX7l9fm8jvUUys2osiYquN0B5JZLgd2DI",
  authDomain:"barberia-demo-22bb4.firebaseapp.com",
  databaseURL:"https://barberia-demo-22bb4-default-rtdb.firebaseio.com",
  projectId:"barberia-demo-22bb4",
  storageBucket:"barberia-demo-22bb4.firebasestorage.app",
  messagingSenderId:"360287665229",
  appId:"1:360287665229:web:b0c48af17c5dbec7fdb004"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.database();
let business=null,bookings={};

function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function slugify(v){return v.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,45)}
function renderAuth(){
 document.getElementById("app").innerHTML=`<section class="container"><div class="authgrid">
 <div class="card"><div class="kicker">Nueva peluquería</div><div class="title">Crear cuenta</div><p class="muted">Registrá tu negocio. Después vas a poder cargar sucursales, profesionales, servicios y compartir tu link de reservas.</p><div id="reg-msg"></div>
 <div class="field"><label>Nombre del negocio</label><input id="r-name" placeholder="Ej. Barbería Central"></div>
 <div class="field"><label>WhatsApp</label><input id="r-phone" placeholder="Ej. 1132006823"></div>
 <div class="field"><label>Email</label><input id="r-email" type="email"></div>
 <div class="field"><label>Contraseña</label><input id="r-pass" type="password" placeholder="Mínimo 6 caracteres"></div>
 <button class="btn primary" style="width:100%;margin-top:14px" onclick="register()">Crear cuenta</button></div>
 <div class="card"><div class="kicker">Acceso privado</div><div class="title">Iniciar sesión</div><p class="muted">Entrá al panel para ver turnos, clientes, estadísticas y administrar tu peluquería.</p><div id="login-msg"></div>
 <div class="field"><label>Email</label><input id="l-email" type="email"></div>
 <div class="field"><label>Contraseña</label><input id="l-pass" type="password"></div>
 <button class="btn gold" style="width:100%;margin-top:14px" onclick="login()">Ingresar</button></div>
 </div></section>`;
}
async function register(){
 const name=document.getElementById("r-name").value.trim(),phone=document.getElementById("r-phone").value.trim(),email=document.getElementById("r-email").value.trim(),pass=document.getElementById("r-pass").value,msg=document.getElementById("reg-msg");
 if(!name||!email||!pass){msg.innerHTML='<div class="error">Completá nombre, email y contraseña.</div>';return}
 try{
  const cred=await auth.createUserWithEmailAndPassword(email,pass),uid=cred.user.uid;
  const all=(await db.ref("negocios").once("value")).val()||{};let base=slugify(name)||"peluqueria",slug=base,i=2;
  while(Object.values(all).some(x=>x.slug===slug)){slug=base+"-"+i++}
  await db.ref("negocios/"+uid).set({name,phone,email,slug,createdAt:Date.now(),branches:{principal:{name:"Sucursal principal",address:""}},professionals:{},services:{},workTimes:["10:00","10:40","11:20","12:00","12:40","13:20","14:00","14:40","15:20","16:00","16:40","17:20","18:00","18:40","19:20"]});
 }catch(e){msg.innerHTML='<div class="error">'+esc(e.message)+'</div>'}
}
async function login(){try{await auth.signInWithEmailAndPassword(document.getElementById("l-email").value.trim(),document.getElementById("l-pass").value)}catch(e){document.getElementById("login-msg").innerHTML='<div class="error">No se pudo iniciar sesión. Revisá los datos.</div>'}}
async function logout(){await auth.signOut()}
async function loadBusiness(){
 const u=auth.currentUser;if(!u)return null;const s=await db.ref("negocios/"+u.uid).once("value");return s.exists()?{...s.val(),id:u.uid}:null
}
async function renderDashboard(){
 business=await loadBusiness();if(!business){renderAuth();return}
 const s=await db.ref("negocios/"+business.id+"/turnos").once("value");bookings=s.val()||{};
 document.getElementById("app").innerHTML=`<section class="container">
 <div class="head"><div><div class="kicker">Panel del negocio</div><div class="title">${esc(business.name)}</div><p class="muted">${esc(business.email||"")} · /?negocio=${esc(business.slug)}</p></div><div class="actions"><button class="btn" onclick="openPublic()">Ver página de clientes</button><button class="btn" onclick="logout()">Cerrar sesión</button></div></div>
 <div class="stats"><div class="stat accent"><small>Turnos activos</small><strong id="st-total">0</strong></div><div class="stat"><small>Hoy</small><strong id="st-today">0</strong></div><div class="stat"><small>Clientes únicos</small><strong id="st-clients">0</strong></div><div class="stat"><small>Ingresos registrados</small><strong id="st-money">$ 0</strong></div></div>
 <div class="tabs"><button class="btn tab active" onclick="showPanel('agenda',this)">📅 Agenda</button><button class="btn tab" onclick="showPanel('stats',this)">📊 Estadísticas</button><button class="btn tab" onclick="showPanel('branches',this)">🏪 Sucursales</button><button class="btn tab" onclick="showPanel('pros',this)">✂️ Profesionales</button><button class="btn tab" onclick="showPanel('services',this)">💈 Servicios</button><button class="btn tab" onclick="showPanel('link',this)">🔗 Mi link</button><button class="btn tab" onclick="showPanel('config',this)">⚙️ Configuración</button></div>
 <div id="p-agenda" class="panel active card"><div class="kicker">Recepción</div><div class="title" style="font-size:20px">Agenda de turnos</div><p class="muted" style="margin-bottom:15px">Todos los turnos que llegaron desde tu link público.</p><div class="table-wrap"><table class="table"><thead><tr><th>Fecha</th><th>Hora</th><th>Sucursal</th><th>Profesional</th><th>Cliente</th><th>Celular</th><th>Servicio</th><th>Total</th><th>Estado</th><th></th></tr></thead><tbody id="agenda-body"></tbody></table></div></div>
 <div id="p-stats" class="panel card"><div class="kicker">Rendimiento</div><div class="title" style="font-size:20px">Estadísticas</div><p class="muted">Resumen general del negocio.</p><div class="stats" style="margin-top:16px"><div class="stat"><small>Profesionales</small><strong>${Object.keys(business.professionals||{}).length}</strong></div><div class="stat"><small>Sucursales</small><strong>${Object.keys(business.branches||{}).length}</strong></div><div class="stat"><small>Servicios</small><strong>${Object.keys(business.services||{}).length}</strong></div><div class="stat"><small>Clientes</small><strong id="st-clients-2">0</strong></div></div></div>
 <div id="p-branches" class="panel card">${branchesPanel()}</div>
 <div id="p-pros" class="panel card">${prosPanel()}</div>
 <div id="p-services" class="panel card">${servicesPanel()}</div>
 <div id="p-link" class="panel card"><div class="kicker">Compartir</div><div class="title" style="font-size:20px">Tu link para clientes</div><p class="muted">Este es el enlace que podés poner en Instagram, WhatsApp, TikTok o un QR.</p><div class="copybox" style="margin-top:15px"><input id="public-link" readonly><button class="btn primary" onclick="copyLink()">Copiar</button></div></div>
 <div id="p-config" class="panel card"><div class="kicker">Negocio</div><div class="title" style="font-size:20px">Configuración</div><div class="grid2" style="margin-top:13px"><div class="field"><label>Nombre</label><input id="c-name" value="${esc(business.name)}"></div><div class="field"><label>WhatsApp</label><input id="c-phone" value="${esc(business.phone||"")}"></div></div><button class="btn gold" onclick="saveConfig()">Guardar</button><div id="config-msg"></div></div>
 </section>`;
 fillStatsAndAgenda();
}
function branchesPanel(){
 const rows=Object.entries(business.branches||{}).map(([id,b])=>`<div class="row-card"><div><b>${esc(b.name)}</b><small>${esc(b.address||"Sin dirección")}</small></div><button class="btn danger" onclick="deleteBranch('${id}')">Eliminar</button></div>`).join("");
 return `<div class="kicker">Sucursales</div><div class="title" style="font-size:20px">Administrar sucursales</div><div class="inline"><div class="field"><label>Nombre</label><input id="b-name" placeholder="Sucursal Centro"></div><div class="field"><label>Dirección</label><input id="b-address" placeholder="Dirección"></div><button class="btn gold" onclick="addBranch()">Agregar</button></div><div>${rows||'<p class="muted">Todavía no hay sucursales.</p>'}</div>`;
}
function prosPanel(){
 const branches=Object.entries(business.branches||{});
 const rows=Object.entries(business.professionals||{}).map(([id,p])=>`<div class="row-card"><div><b>${esc(p.name)}</b><small>${esc((business.branches||{})[p.branchId]?.name||"Sin sucursal")} · ${esc(p.specialty||"")}</small></div><button class="btn danger" onclick="deletePro('${id}')">Eliminar</button></div>`).join("");
 return `<div class="kicker">Equipo</div><div class="title" style="font-size:20px">Profesionales</div><div class="grid2"><div class="field"><label>Nombre</label><input id="p-name" placeholder="Nombre del profesional"></div><div class="field"><label>Especialidad</label><input id="p-specialty" placeholder="Fade, color, etc."></div></div><div class="field"><label>Sucursal</label><select id="p-branch">${branches.map(([id,b])=>`<option value="${id}">${esc(b.name)}</option>`).join("")}</select></div><button class="btn gold" onclick="addPro()">Agregar profesional</button><div>${rows||'<p class="muted">Todavía no hay profesionales.</p>'}</div>`;
}
function servicesPanel(){
 const rows=Object.entries(business.services||{}).map(([id,s])=>`<div class="row-card"><div><b>${esc(s.name)}</b><small>${Number(s.duration||0)} min · $ ${Number(s.price||0).toLocaleString("es-AR")}</small></div><button class="btn danger" onclick="deleteService('${id}')">Eliminar</button></div>`).join("");
 return `<div class="kicker">Catálogo</div><div class="title" style="font-size:20px">Servicios</div><div class="grid2"><div class="field"><label>Nombre</label><input id="s-name" placeholder="Corte + barba"></div><div class="field"><label>Descripción</label><input id="s-desc" placeholder="Detalle"></div><div class="field"><label>Precio</label><input id="s-price" type="number" placeholder="18000"></div><div class="field"><label>Duración (min)</label><input id="s-duration" type="number" value="40"></div></div><button class="btn gold" onclick="addService()">Agregar servicio</button><div>${rows||'<p class="muted">Todavía no hay servicios.</p>'}</div>`;
}
function showPanel(name,btn){document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.getElementById("p-"+name).classList.add("active");btn.classList.add("active")}
function fillStatsAndAgenda(){
 const arr=Object.values(bookings).filter(b=>b.status!=="cancelled"),today=new Date().toISOString().slice(0,10),clients=new Set(arr.map(b=>b.phone||b.patient)).size,money=arr.reduce((a,b)=>a+Number(b.totalPrice||0),0);
 document.getElementById("st-total").textContent=arr.length;document.getElementById("st-today").textContent=arr.filter(b=>b.dateStr===today).length;document.getElementById("st-clients").textContent=clients;document.getElementById("st-clients-2").textContent=clients;document.getElementById("st-money").textContent="$ "+money.toLocaleString("es-AR");
 document.getElementById("public-link").value=location.origin+location.pathname.replace("negocios.html","index.html")+"?negocio="+business.slug;
 const rows=Object.entries(bookings).map(([key,b])=>({...b,key})).filter(b=>b.status!=="cancelled").sort((a,b)=>(a.dateStr+a.time).localeCompare(b.dateStr+b.time));
 document.getElementById("agenda-body").innerHTML=rows.length?rows.map(b=>`<tr><td>${esc(b.dateStr)}</td><td><b>${esc(b.time)} hs</b></td><td>${esc(b.branchName||"")}</td><td>${esc(b.barber||b.professionalName||"")}</td><td><b>${esc(b.patient||"")}</b></td><td>${esc(b.phone||"")}</td><td>${esc(b.service||"")}</td><td>$ ${Number(b.totalPrice||0).toLocaleString("es-AR")}</td><td><span class="badge gold">Reservado</span></td><td><button class="btn danger" onclick="cancelTurn('${b.key}')">Cancelar</button></td></tr>`).join(""):'<tr><td colspan="10" style="text-align:center;color:#9699a1;padding:35px">Todavía no hay turnos.</td></tr>';
}
async function cancelTurn(key){if(confirm("¿Cancelar este turno?")){await db.ref(`negocios/${business.id}/turnos/${key}`).update({status:"cancelled",cancelledAt:Date.now()});renderDashboard()}}
async function addBranch(){const name=document.getElementById("b-name").value.trim(),address=document.getElementById("b-address").value.trim();if(!name)return;await db.ref(`negocios/${business.id}/branches`).push({name,address});renderDashboard()}
async function deleteBranch(id){if(confirm("¿Eliminar sucursal?")){await db.ref(`negocios/${business.id}/branches/${id}`).remove();renderDashboard()}}
async function addPro(){const name=document.getElementById("p-name").value.trim(),specialty=document.getElementById("p-specialty").value.trim(),branchId=document.getElementById("p-branch").value;if(!name||!branchId)return;await db.ref(`negocios/${business.id}/professionals`).push({name,specialty,branchId,active:true});renderDashboard()}
async function deletePro(id){if(confirm("¿Eliminar profesional?")){await db.ref(`negocios/${business.id}/professionals/${id}`).remove();renderDashboard()}}
async function addService(){const name=document.getElementById("s-name").value.trim(),description=document.getElementById("s-desc").value.trim(),price=Number(document.getElementById("s-price").value||0),duration=Number(document.getElementById("s-duration").value||40);if(!name)return;await db.ref(`negocios/${business.id}/services`).push({name,description,price,duration,active:true});renderDashboard()}
async function deleteService(id){if(confirm("¿Eliminar servicio?")){await db.ref(`negocios/${business.id}/services/${id}`).remove();renderDashboard()}}
async function saveConfig(){const name=document.getElementById("c-name").value.trim(),phone=document.getElementById("c-phone").value.trim();await db.ref(`negocios/${business.id}`).update({name,phone});document.getElementById("config-msg").innerHTML='<div class="success">Cambios guardados.</div>';business.name=name;business.phone=phone}
function copyLink(){navigator.clipboard.writeText(document.getElementById("public-link").value);alert("Link copiado.")}
function openPublic(){location.href="index.html?negocio="+business.slug}
auth.onAuthStateChanged(user=>{if(user)renderDashboard();else renderAuth()});
</script>
</body>
</html>
