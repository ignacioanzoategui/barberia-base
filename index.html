<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Turnos Pro</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{--bg:#0b0b0c;--s:#111214;--s2:#181a1e;--b:#292d33;--t:#f7f7f5;--m:#9699a1;--a:#d7b35a;--g:#69d39b;--r:#e47d7d}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(circle at 50% -10%,rgba(215,179,90,.07),transparent 34%),var(--bg);color:var(--t);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:30;background:rgba(10,10,11,.92);backdrop-filter:blur(18px);border-bottom:1px solid #202228;padding:14px 18px}.nav{max-width:1180px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:900;letter-spacing:1.6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.brand span{color:var(--a)}.nav-placeholder{width:44px}.icon-btn{width:42px;height:42px;padding:0;border-radius:11px;font-size:18px}
.wrap{max-width:1120px;margin:auto;padding:34px 18px 70px}.btn{border:1px solid var(--b);background:var(--s2);color:var(--t);padding:10px 13px;border-radius:10px;font-size:12px;font-weight:800;text-decoration:none;display:inline-flex;justify-content:center;align-items:center}.btn.primary{background:#fff;color:#000;border-color:#fff}.btn.gold{background:var(--a);color:#111;border-color:var(--a)}.btn:disabled{opacity:.35;cursor:not-allowed}
.card{background:linear-gradient(180deg,var(--s2),var(--s));border:1px solid var(--b);border-radius:18px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.18)}.k{font-size:10px;color:var(--a);font-weight:900;letter-spacing:2px;text-transform:uppercase}.title{font-size:28px;font-weight:850;margin-top:5px}.muted{font-size:12px;color:var(--m);line-height:1.55;margin-top:6px}
.hero{text-align:center;padding:88px 12px 45px}.hero h1{font-family:Georgia,serif;font-size:clamp(42px,7vw,70px);font-weight:400;letter-spacing:-2px;margin:16px 0}.hero p{max-width:650px;margin:auto;color:var(--m);line-height:1.7;font-size:14px}.home-actions{display:flex;justify-content:center;gap:10px;margin-top:25px}
.business-entry{text-align:center;padding:78px 12px 40px}.business-mark{width:72px;height:72px;border:1px solid rgba(215,179,90,.5);background:rgba(215,179,90,.07);border-radius:20px;margin:0 auto 16px;display:grid;place-items:center;color:var(--a);font-size:28px;font-weight:900}.business-entry h1{font-family:Georgia,serif;font-size:clamp(42px,7vw,66px);font-weight:400;letter-spacing:-1.8px;margin:12px 0}.business-entry p{max-width:580px;margin:auto;color:var(--m);font-size:14px;line-height:1.7}.entry-actions{display:flex;justify-content:center;gap:10px;margin-top:26px;flex-wrap:wrap}.entry-branches{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:760px;margin:35px auto 0;text-align:left}.branch-preview{border:1px solid var(--b);background:var(--s);border-radius:14px;padding:15px}.branch-preview small{display:block;color:var(--m);margin-top:5px;line-height:1.45}
.booking{display:grid;grid-template-columns:1fr 330px;gap:18px}.opt{width:100%;border:1px solid var(--b);background:var(--s2);color:#fff;border-radius:12px;padding:14px;display:flex;justify-content:space-between;gap:12px;text-align:left;align-items:center;margin-top:8px}.opt.sel{border-color:var(--a);background:rgba(215,179,90,.08)}.opt small{display:block;color:var(--m);margin-top:4px}.field{margin-top:12px}.field label{display:block;font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--m);font-weight:900;margin-bottom:7px}.field input,.field select{width:100%;padding:12px;background:#0f1012;border:1px solid var(--b);color:#fff;border-radius:10px;outline:none}.branch-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:10px}.branch-card{border:1px solid var(--b);background:#101113;border-radius:12px;padding:13px}.branch-card small{display:block;color:var(--m);font-size:11px;line-height:1.45;margin-top:5px}
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.time{padding:11px;border:1px solid var(--b);background:var(--s2);color:#fff;border-radius:9px;font-weight:800}.time.sel{border-color:var(--a);color:var(--a);background:rgba(215,179,90,.08)}.time.busy{opacity:.28;text-decoration:line-through;cursor:not-allowed}.time.past{opacity:.22;cursor:not-allowed}.summary{position:sticky;top:86px;height:max-content}.sum{display:flex;justify-content:space-between;gap:10px;font-size:12px;margin-bottom:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}.modal.open{display:flex}.modal-card{width:min(480px,100%);max-height:88vh;overflow:auto;background:#17191c;border:1px solid #303239;border-radius:18px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.close{width:32px;height:32px;padding:0}
@media(max-width:800px){.booking{grid-template-columns:1fr}.summary{position:static}.times{grid-template-columns:repeat(2,1fr)}.branch-cards,.entry-branches{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div id="topnav" class="nav"><div class="nav-placeholder"></div><div id="topbrand" class="brand">TURNOS <span>PRO</span></div><div id="topactions" class="nav-placeholder"></div></div></header>
<main id="app"></main>
<div id="modal" class="modal"><div class="modal-card"><div id="mc"></div></div></div>
<script>
const firebaseConfig={
  apiKey:"AIzaSyBX7l9fm8jvUUys2osiYquN0B5JZLgd2DI",
  authDomain:"barberia-demo-22bb4.firebaseapp.com",
  databaseURL:"https://barberia-demo-22bb4-default-rtdb.firebaseio.com",
  projectId:"barberia-demo-22bb4",
  storageBucket:"barberia-demo-22bb4.firebasestorage.app",
  messagingSenderId:"360287665229",
  appId:"1:360287665229:web:b0c48af17c5dbec7fdb004"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let P=null,UID=null,SVC=null,BR=null,PRO="ANY",DATE="",TIME="",BOOKINGS={},bookingRef=null;
const defaultBaseInterval=10;
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));

function localDateString(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");return `${y}-${m}-${day}`}
function minutesNow(){const d=new Date();return d.getHours()*60+d.getMinutes()}
function toMin(t){const[h,m]=String(t).split(":").map(Number);return h*60+m}
function fromMin(total){const h=Math.floor(total/60),m=total%60;return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`}
function overlaps(aStart,aDur,bStart,bDur){const a1=toMin(aStart),a2=a1+Number(aDur||0),b1=toMin(bStart),b2=b1+Number(bDur||0);return a1<b2&&b1<a2}
function selectedDuration(){return Number(P.services?.[SVC]?.duration||40)}
function getBreaksFor(pid,dateStr){
  const dow=new Date(dateStr+"T12:00:00").getDay();
  const weekly=P.professionalBreaks?.[pid]?.weekly?.[dow]||[];
  const specific=P.professionalBreaks?.[pid]?.dates?.[dateStr]||[];
  const normalize=x=>Array.isArray(x)?x:Object.values(x||{});
  return [...normalize(weekly),...normalize(specific)].filter(x=>x&&x.start&&x.end);
}
function conflictsWithBreak(pid,dateStr,start,duration){
  return getBreaksFor(pid,dateStr).some(br=>overlaps(start,duration,br.start,toMin(br.end)-toMin(br.start)));
}
function isPastSlot(dateStr,time){const today=localDateString();if(dateStr<today)return true;if(dateStr>today)return false;return toMin(time)<=minutesNow()}
function closeModal(){document.getElementById("modal").classList.remove("open")}
function resetHeader(){document.getElementById("topbrand").innerHTML='TURNOS <span>PRO</span>';document.getElementById("topactions").innerHTML="";document.getElementById("topactions").className="nav-placeholder"}
function businessHeader(){document.getElementById("topbrand").textContent=P.name||"Barbería";const a=document.getElementById("topactions");a.className="";a.innerHTML='<button class="btn icon-btn" aria-label="Ver sucursales" title="Sucursales" onclick="showLocations()">⌖</button>'}
function home(){resetHeader();document.getElementById("app").innerHTML=`<section class="wrap"><div class="hero"><div class="k">Sistema de reservas</div><h1>Reservas online para barberías.</h1><p>Esta portada es neutra. Los clientes ingresan desde el link que les comparte su barbería.</p><div class="home-actions"><a class="btn primary" href="negocios.html">Registrar barbería</a><a class="btn" href="negocios.html">Iniciar sesión</a></div></div></section>`}
async function load(slug){
  const s=await db.ref(`publicProfiles/${slug}`).once("value");
  if(!s.exists()){resetHeader();document.getElementById("app").innerHTML='<section class="wrap"><div class="card"><h2>Barbería no encontrada</h2><p class="muted">El enlace no corresponde a un negocio activo.</p></div></section>';return}
  P=s.val();UID=P.ownerUid;BR=Object.keys(P.branches||{}).find(id=>P.branches[id]?.active!==false)||null;PRO="ANY";SVC=Object.entries(P.services||{}).find(([,x])=>x.active!==false)?.[0]||null;
  businessHeader();attachBookings();businessLanding();
}
function attachBookings(){
  if(bookingRef)bookingRef.off();
  bookingRef=db.ref(`negocios/${UID}/turnos`);
  bookingRef.on("value",snap=>{BOOKINGS=snap.val()||{};if(document.getElementById("times")&&DATE)renderTimes()});
}
function showLocations(){
  const bs=Object.entries(P.branches||{}).filter(([,b])=>b.active!==false);
  document.getElementById("mc").innerHTML=`<div class="modal-head"><div><div class="k">Sucursales</div><h2>${esc(P.name)}</h2></div><button class="btn close" onclick="closeModal()">×</button></div>${bs.map(([id,b])=>`<div class="branch-card" style="margin-top:9px"><b>${esc(b.name)}</b><small>${esc(b.address||"Dirección pendiente de cargar")}</small>${b.address?`<a class="btn" style="margin-top:9px;width:100%" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(b.address)}">Ver en Google Maps</a>`:""}</div>`).join("")||'<p class="muted">No hay sucursales cargadas.</p>'}`;
  document.getElementById("modal").classList.add("open");
}
function businessLanding(){
  businessHeader();
  const bs=Object.entries(P.branches||{}).filter(([,b])=>b.active!==false);
  document.getElementById("app").innerHTML=`<section class="wrap"><div class="business-entry"><div class="business-mark">${esc((P.name||"B").charAt(0).toUpperCase())}</div><div class="k">Reservas online</div><h1>${esc(P.name)}</h1><p>${esc(P.description||"Elegí tu servicio, profesional y horario para reservar en pocos pasos.")}</p><div class="entry-actions"><button class="btn primary" onclick="startBooking()">Reservar turno →</button><button class="btn" onclick="showLocations()">Ver sucursales</button></div><div class="entry-branches">${bs.map(([id,b])=>`<div class="branch-preview"><b>${esc(b.name)}</b><small>${esc(b.address||"Dirección pendiente de cargar")}</small></div>`).join("")}</div></div></section>`;
}
function startBooking(){PRO="ANY";DATE="";TIME="";renderBooking()}
function activePros(){return Object.entries(P.professionals||{}).filter(([,p])=>p.active!==false&&p.branchId===BR)}
function workRange(dateStr,pid){
  const dow=new Date(dateStr+"T12:00:00").getDay();
  const businessCfg=P.weeklyHours?.[dow];
  const proCfg=P.professionalSchedules?.[pid]?.[dow];
  if(businessCfg?.closed||proCfg?.closed)return null;
  return {
    start:proCfg?.start||businessCfg?.start||"00:00",
    end:proCfg?.end||businessCfg?.end||"23:59"
  };
}
function busyIntervals(pid,dateStr){
  const name=P.professionals?.[pid]?.name||"";
  const intervals=[];

  Object.values(BOOKINGS).forEach(x=>{
    if(x.status==="cancelled"||String(x.dateStr||"")!==String(dateStr))return;
    const samePro=String(x.professionalId||"")===String(pid)||String(x.barber||x.professionalName||"")===String(name);
    if(!samePro)return;
    const start=toMin(x.time||"00:00"),end=start+Number(x.duration||40);
    intervals.push({start,end,type:"booking"});
  });

  getBreaksFor(pid,dateStr).forEach(br=>{
    intervals.push({start:toMin(br.start),end:toMin(br.end),type:"break"});
  });

  return intervals.sort((a,b)=>a.start-b.start);
}
function candidateSlotsForPro(dateStr,pid,duration=selectedDuration()){
  if(!pid||P.closedDates?.[dateStr]?.closed||P.professionalAbsences?.[pid]?.[dateStr]?.absent)return[];
  const range=workRange(dateStr,pid);
  if(!range)return[];

  const startMin=toMin(range.start),endMin=toMin(range.end);
  const busy=busyIntervals(pid,dateStr);
  let cursor=startMin;
  const result=[];

  // Hoy: nunca ofrecemos un inicio que ya pasó.
  if(dateStr===localDateString()){
    const now=minutesNow();
    if(cursor<now){
      // Redondeo solamente el punto de entrada actual a 5 minutos para no mostrar 14:37, por ejemplo.
      cursor=Math.ceil(now/5)*5;
    }
  }

  while(cursor+duration<=endMin){
    const conflict=busy.find(x=>cursor<x.end && x.start<cursor+duration);
    if(conflict){
      cursor=Math.max(cursor,conflict.end);
      continue;
    }

    result.push(fromMin(cursor));
    // Después de un espacio libre, el próximo candidato avanza la duración REAL del servicio.
    cursor+=duration;
  }

  return result;
}
function proAvailable(pid,dateStr,time){
  return candidateSlotsForPro(dateStr,pid,selectedDuration()).includes(time);
}
function availableProsAt(dateStr,time){
  return activePros().filter(([pid])=>proAvailable(pid,dateStr,time));
}
function renderBooking(){
  businessHeader();
  const sv=Object.entries(P.services||{}).filter(([,s])=>s.active!==false),bs=Object.entries(P.branches||{}).filter(([,b])=>b.active!==false),ps=activePros(),svc=P.services?.[SVC],br=P.branches?.[BR],pro=PRO==="ANY"?null:P.professionals?.[PRO];
  document.getElementById("app").innerHTML=`<section class="wrap"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px"><div><div class="k">${esc(P.name)}</div><div class="title" style="font-size:24px">Reservar turno</div></div><button class="btn" onclick="businessLanding()">← Inicio</button></div><div class="booking"><div>
  <div class="card"><h2>1. Servicio</h2>${sv.map(([id,s])=>`<button class="opt ${SVC===id?"sel":""}" onclick="SVC='${id}';renderBooking()"><span><b>${esc(s.name)}</b><small>${s.duration||40} min</small></span><b>$ ${Number(s.price||0).toLocaleString("es-AR")}</b></button>`).join("")||'<p class="muted">La barbería todavía no cargó servicios.</p>'}</div>
  <div class="card" style="margin-top:15px"><h2>2. Sucursal y profesional</h2><div class="branch-cards">${bs.map(([id,b])=>`<div class="branch-card"><b>${esc(b.name)}</b><small>${esc(b.address||"Dirección pendiente de cargar")}</small>${b.address?`<a class="btn" style="margin-top:9px;width:100%" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(b.address)}">Ver en Google Maps</a>`:""}</div>`).join("")}</div><div class="field"><label>Elegir sucursal</label><select onchange="BR=this.value;PRO='ANY';TIME='';renderBooking()">${bs.map(([id,b])=>`<option value="${id}" ${id===BR?"selected":""}>${esc(b.name)}</option>`).join("")}</select></div>
  <button class="opt ${PRO==="ANY"?"sel":""}" onclick="PRO='ANY';TIME='';renderBooking()"><span><b>Cualquier peluquero</b><small>Se asigna automáticamente uno disponible en ese horario</small></span><span>⚡</span></button>
  ${ps.map(([id,p])=>`<button class="opt ${PRO===id?"sel":""}" onclick="PRO='${id}';TIME='';renderBooking()"><span><b>${esc(p.name)}</b><small>${esc(p.specialty||"Profesional")}</small></span><span>✓</span></button>`).join("")||'<p class="muted">No hay profesionales activos en esta sucursal.</p>'}</div>
  <div class="card" style="margin-top:15px"><h2>3. Fecha y hora</h2><p class="muted">Solo aparecen horarios realmente disponibles para la duración del servicio.</p><div class="field"><label>Fecha</label><input id="date" type="date" min="${localDateString()}" onkeydown="return false" onclick="this.showPicker&&this.showPicker()" onchange="setDateAndTimes()"></div><div id="times" class="times"></div></div></div>
  <aside class="card summary"><h2>Resumen</h2><div class="sum"><span>Servicio</span><b>${esc(svc?.name||"—")}</b></div><div class="sum"><span>Sucursal</span><b>${esc(br?.name||"—")}</b></div><div class="sum"><span>Profesional</span><b>${PRO==="ANY"?"Cualquier peluquero":esc(pro?.name||"—")}</b></div><div class="sum"><span>Fecha</span><b id="sd">${DATE||"—"}</b></div><div class="sum"><span>Hora</span><b id="st">${TIME?TIME+" hs":"—"}</b></div><button class="btn primary" style="width:100%;margin-top:12px" onclick="clientForm()">Continuar</button></aside></div></section>`;
  const input=document.getElementById("date");input.value=DATE||localDateString();DATE=input.value;renderTimes();
}
function setDateAndTimes(){DATE=document.getElementById("date").value;TIME="";document.getElementById("sd").textContent=DATE;document.getElementById("st").textContent="—";renderTimes()}
function renderTimes(){
  const box=document.getElementById("times");if(!box||!DATE)return;
  if(DATE<localDateString()){box.innerHTML='<p class="muted">Ese día ya pasó.</p>';return}
  if(P.closedDates?.[DATE]?.closed){box.innerHTML='<p class="muted">La barbería no trabaja este día.</p>';return}

  const duration=selectedDuration();
  let slots=[];

  if(PRO==="ANY"){
    const set=new Set();
    activePros().forEach(([pid])=>{
      candidateSlotsForPro(DATE,pid,duration).forEach(t=>set.add(t));
    });
    slots=[...set].sort((a,b)=>toMin(a)-toMin(b));
  }else{
    slots=candidateSlotsForPro(DATE,PRO,duration);
  }

  // Solo mostramos horarios que realmente se pueden tocar/reservar.
  box.innerHTML=slots.map(t=>`<button class="time ${TIME===t?"sel":""}" onclick="pick('${t}',this)">${t}</button>`).join("")
    ||'<p class="muted">No quedan horarios disponibles para este servicio.</p>';
}
function pick(t,e){document.querySelectorAll(".time").forEach(x=>x.classList.remove("sel"));e.classList.add("sel");TIME=t;document.getElementById("st").textContent=t+" hs"}
function clientForm(){
  if(!SVC||!BR||!DATE||!TIME)return alert("Completá servicio, sucursal, fecha y horario.");
  if(PRO!=="ANY"&&!proAvailable(PRO,DATE,TIME))return alert("Ese horario ya no está disponible.");
  if(PRO==="ANY"&&!availableProsAt(DATE,TIME).length)return alert("Ya no quedan peluqueros disponibles en ese horario.");
  document.getElementById("mc").innerHTML=`<div class="modal-head"><h2>Confirmar turno</h2><button class="btn close" onclick="closeModal()">×</button></div><div class="field"><label>Nombre y apellido</label><input id="cn"></div><div class="field"><label>Celular</label><input id="cp"></div><button class="btn primary" style="width:100%;margin-top:14px" onclick="saveBooking()">Confirmar reserva</button>`;
  document.getElementById("modal").classList.add("open");
}
async function saveBooking(){
  const n=document.getElementById("cn").value.trim(),phone=document.getElementById("cp").value.trim();if(!n||!phone)return alert("Completá tus datos.");
  const snap=await db.ref(`negocios/${UID}/turnos`).once("value");BOOKINGS=snap.val()||{};
  let assignedId=PRO;
  if(PRO==="ANY"){const available=availableProsAt(DATE,TIME);if(!available.length){closeModal();alert("Ese horario acaba de ocuparse por completo. Elegí otro.");renderTimes();return}assignedId=available[0][0]}
  else if(!proAvailable(PRO,DATE,TIME)){closeModal();alert("Ese horario acaba de ocuparse para ese profesional. Elegí otro.");renderTimes();return}
  const key=db.ref(`negocios/${UID}/turnos`).push().key,s=P.services[SVC],b=P.branches[BR],pr=P.professionals[assignedId];
  const booking={key,patient:n,phone,dateStr:DATE,time:TIME,service:s.name,totalPrice:Number(s.price||0),duration:Number(s.duration||40),branchId:BR,branchName:b.name,professionalId:assignedId,professionalName:pr.name,barber:pr.name,status:"reserved",createdAt:Date.now(),source:"public_link"};
  await db.ref(`negocios/${UID}/turnos/${key}`).set(booking);BOOKINGS[key]=booking;
  const msg=encodeURIComponent(`CONFIRMACIÓN DE TURNO - ${P.name}\nCliente: ${n}\nTeléfono: ${phone}\nSucursal: ${b.name}\nProfesional: ${pr.name}\nServicio: ${s.name}\nFecha: ${DATE}\nHora: ${TIME} hs`);
  document.getElementById("mc").innerHTML=`<div style="text-align:center"><div style="font-size:48px;color:var(--a)">✓</div><h2>¡Reserva confirmada!</h2><p class="muted">Tu turno quedó con <b>${esc(pr.name)}</b>.</p><button class="btn gold" style="width:100%;margin-top:14px" onclick="window.open('https://wa.me/${esc(P.phone||"")}?text=${msg}','_blank');closeModal();businessLanding()">Enviar por WhatsApp y volver al inicio</button><button class="btn" style="width:100%;margin-top:8px" onclick="closeModal();businessLanding()">Volver al inicio</button></div>`;
}
setInterval(()=>{if(document.getElementById("times")&&DATE)renderTimes()},30000);
const slug=new URLSearchParams(location.search).get("negocio");slug?load(slug):home();
</script>
</body>
</html>
