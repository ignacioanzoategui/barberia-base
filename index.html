<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Turnos Pro</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{--bg:#0b0b0c;--s:#111214;--s2:#181a1e;--b:#2a2d33;--t:#f7f7f5;--m:#9699a1;--a:#d7b35a;--g:#69d39b;--r:#e47d7d}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(circle at 50% -10%,rgba(215,179,90,.07),transparent 34%),var(--bg);color:var(--t);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:30;background:rgba(10,10,11,.9);backdrop-filter:blur(18px);border-bottom:1px solid #202228;padding:15px 20px}.nav{max-width:1220px;margin:auto;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:2px}.brand span{color:var(--a)}
.wrap{max-width:1220px;margin:auto;padding:34px 18px 70px}.btn{border:1px solid var(--b);background:var(--s2);color:var(--t);padding:10px 13px;border-radius:10px;font-size:12px;font-weight:800;text-decoration:none;display:inline-flex;justify-content:center;align-items:center}.btn.primary{background:#fff;color:#000;border-color:#fff}.btn.gold{background:var(--a);color:#111;border-color:var(--a)}.btn.danger{color:var(--r)}.btn.green{color:var(--g)}
.card{background:linear-gradient(180deg,var(--s2),var(--s));border:1px solid var(--b);border-radius:18px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.18)}.k{font-size:10px;color:var(--a);font-weight:900;letter-spacing:2px;text-transform:uppercase}.title{font-size:27px;font-weight:850;margin-top:5px}.muted{font-size:12px;color:var(--m);line-height:1.55;margin-top:6px}.field{margin-top:12px}.field label{display:block;font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--m);font-weight:900;margin-bottom:7px}.field input,.field select{width:100%;padding:12px;background:#0f1012;border:1px solid var(--b);color:#fff;border-radius:10px;outline:none}.field input:focus,.field select:focus{border-color:var(--a)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}.stat{background:var(--s);border:1px solid var(--b);border-radius:14px;padding:14px}.stat small{color:var(--m);font-size:10px}.stat strong{display:block;font-size:24px;margin-top:4px}.stat.a strong{color:var(--a)}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px;border:1px solid var(--b);border-radius:11px;background:#101113;margin-top:8px}.row small{display:block;color:var(--m);margin-top:3px}.actions{display:flex;gap:8px;flex-wrap:wrap}
.table-wrap{overflow:auto;border:1px solid var(--b);border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:980px}.table th{background:#151619;color:var(--m);font-size:9px;text-transform:uppercase;letter-spacing:1px;text-align:left;padding:11px}.table td{padding:12px 11px;border-top:1px solid rgba(255,255,255,.05);font-size:11px}.badge{display:inline-flex;padding:5px 8px;border-radius:7px;font-size:9px;font-weight:900}.bg{color:var(--g);background:rgba(105,211,155,.08)}.ba{color:var(--a);background:rgba(215,179,90,.1)}.bm{color:var(--m);background:#22242a}.br{color:var(--r);background:rgba(228,125,125,.08)}
@media(max-width:800px){.grid2{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}

.hero{text-align:center;padding:90px 12px 50px}.hero h1{font-family:Georgia,serif;font-size:clamp(42px,7vw,72px);font-weight:400;letter-spacing:-2px;margin:16px 0}.hero p{max-width:650px;margin:auto;color:var(--m);line-height:1.7;font-size:14px}.home-actions{display:flex;justify-content:center;gap:10px;margin-top:25px}.booking{display:grid;grid-template-columns:1fr 330px;gap:18px}.opt{width:100%;border:1px solid var(--b);background:var(--s2);color:#fff;border-radius:12px;padding:14px;display:flex;justify-content:space-between;text-align:left;margin-top:8px}.opt.sel{border-color:var(--a);background:rgba(215,179,90,.08)}.times{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.time{padding:11px;border:1px solid var(--b);background:var(--s2);color:#fff;border-radius:9px;font-weight:800}.time.sel{border-color:var(--a);color:var(--a);background:rgba(215,179,90,.08)}.time.busy{opacity:.25;text-decoration:line-through;cursor:not-allowed}.summary{position:sticky;top:88px;height:max-content}.sum{display:flex;justify-content:space-between;gap:10px;font-size:12px;margin-bottom:10px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}.modal.open{display:flex}.modal-card{width:min(470px,100%);background:#17191c;border:1px solid #303239;border-radius:18px;padding:22px}
.branch-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:10px}
.branch-card{border:1px solid var(--b);background:#101113;border-radius:12px;padding:13px}
.branch-card b{display:block;font-size:13px}
.branch-card small{display:block;color:var(--m);font-size:11px;line-height:1.45;margin-top:5px}
@media(max-width:800px){.booking{grid-template-columns:1fr}.summary{position:static}.times{grid-template-columns:repeat(2,1fr)}.branch-cards{grid-template-columns:1fr}}
</style></head>
<body><header><div class="nav" style="justify-content:center"><div class="brand">TURNOS <span>PRO</span></div></div></header><main id="app"></main><div id="modal" class="modal"><div class="modal-card"><div id="mc"></div></div></div>
<script>
const firebaseConfig={
  apiKey:"AIzaSyBX7l9fm8jvUUys2osiYquN0B5JZLgd2DI",
  authDomain:"barberia-demo-22bb4.firebaseapp.com",
  databaseURL:"https://barberia-demo-22bb4-default-rtdb.firebaseio.com",
  projectId:"barberia-demo-22bb4",
  storageBucket:"barberia-demo-22bb4.firebasestorage.app",
  messagingSenderId:"360287665229",
  appId:"1:360287665229:web:b0c48af17c5dbec7fdb004"
};
firebase.initializeApp(firebaseConfig);const db=firebase.database();
let P=null,UID=null,SVC=null,BR=null,PRO=null,DATE="",TIME="";
const defaults=["10:00","10:40","11:20","12:00","12:40","13:20","14:00","14:40","15:20","16:00","16:40","17:20","18:00","18:40","19:20"];
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function home(){document.getElementById("app").innerHTML=`<section class="wrap"><div class="hero"><div class="k">Sistema de reservas</div><h1>Reservas online para peluquerías.</h1><p>Esta portada es neutra. Un cliente reserva solamente cuando entra al link directo de una peluquería registrada.</p><div class="home-actions"><a class="btn primary" href="negocios.html">Registrar mi peluquería</a></div></div><div class="grid2"><div class="card"><b>Para negocios</b><p class="muted">Panel privado, agenda, profesionales, horarios, días cerrados y estadísticas.</p></div><div class="card"><b>Para clientes</b><p class="muted">La peluquería comparte su propio link de reservas.</p></div></div></section>`}
async function load(slug){const s=await db.ref(`publicProfiles/${slug}`).once("value");if(!s.exists()){document.getElementById("app").innerHTML='<section class="wrap"><div class="card"><h2>Peluquería no encontrada</h2><p class="muted">El enlace no corresponde a un negocio activo.</p></div></section>';return}P=s.val();UID=P.ownerUid;BR=Object.keys(P.branches||{})[0]||null;PRO=Object.entries(P.professionals||{}).find(([,p])=>p.active!==false&&p.branchId===BR)?.[0]||null;SVC=Object.entries(P.services||{}).find(([,s])=>s.active!==false)?.[0]||null;render()}
function render(){const sv=Object.entries(P.services||{}).filter(([,s])=>s.active!==false),bs=Object.entries(P.branches||{}).filter(([,b])=>b.active!==false),ps=Object.entries(P.professionals||{}).filter(([,p])=>p.active!==false&&p.branchId===BR),svc=P.services?.[SVC],br=P.branches?.[BR],pro=P.professionals?.[PRO];document.getElementById("app").innerHTML=`<section class="wrap"><div style="text-align:center;padding:35px 0 25px"><div class="k">Reservas online</div><div class="title" style="font-family:Georgia,serif;font-size:42px;font-weight:400">${esc(P.name)}</div><p class="muted">${esc(P.description||"Reservá tu turno online.")}</p></div><div class="booking"><div><div class="card"><h2>1. Servicio</h2>${sv.map(([id,s])=>`<button class="opt ${SVC===id?"sel":""}" onclick="SVC='${id}';render()"><span><b>${esc(s.name)}</b><small style="display:block;color:var(--m);margin-top:4px">${s.duration||40} min</small></span><b>$ ${Number(s.price||0).toLocaleString("es-AR")}</b></button>`).join("")||'<p class="muted">La peluquería todavía no cargó servicios.</p>'}</div><div class="card" style="margin-top:15px"><h2>2. Sucursales</h2>
<p class="muted">Elegí la sede que te quede mejor. Estas son las direcciones disponibles.</p>
<div class="branch-cards">${bs.map(([id,b])=>`<div class="branch-card"><b>${esc(b.name)}</b><small>${esc(b.address||"Dirección pendiente de cargar")}</small></div>`).join("")}</div>
<div class="field"><label>Elegir sucursal</label><select onchange="BR=this.value;PRO=Object.entries(P.professionals||{}).find(([,p])=>p.active!==false&&p.branchId===BR)?.[0]||null;render()">${bs.map(([id,b])=>`<option value="${id}" ${id===BR?"selected":""}>${esc(b.name)}</option>`).join("")}</select></div>${ps.map(([id,p])=>`<button class="opt ${PRO===id?"sel":""}" onclick="PRO='${id}';render()"><span><b>${esc(p.name)}</b><small style="display:block;color:var(--m);margin-top:4px">${esc(p.specialty||"Profesional")}</small></span><span>✓</span></button>`).join("")||'<p class="muted">No hay profesionales activos en esta sucursal.</p>'}</div><div class="card" style="margin-top:15px"><h2>3. Fecha y hora</h2><div class="field"><label>Fecha</label><input id="date" type="date" onchange="times()"></div><div id="times" class="times"></div></div></div><aside class="card summary"><h2>Resumen</h2><div class="sum"><span>Servicio</span><b>${esc(svc?.name||"—")}</b></div><div class="sum"><span>Sucursal</span><b>${esc(br?.name||"—")}</b></div><div class="sum"><span>Profesional</span><b>${esc(pro?.name||"—")}</b></div><div class="sum"><span>Fecha</span><b id="sd">—</b></div><div class="sum"><span>Hora</span><b id="st">—</b></div><button class="btn primary" style="width:100%;margin-top:12px" onclick="clientForm()">Continuar</button></aside></div></section>`;const d=new Date();d.setDate(d.getDate()+1);document.getElementById("date").value=d.toISOString().slice(0,10);times()}
function allowed(d){const c=P.weeklyHours?.[new Date(d+"T12:00:00").getDay()];if(c?.closed)return[];let a=P.workTimes||defaults;const M=t=>{const[h,m]=t.split(":").map(Number);return h*60+m};if(c?.start&&c?.end){const x=M(c.start),y=M(c.end);a=a.filter(t=>M(t)>=x&&M(t)<=y)}return a}
async function times(){DATE=document.getElementById("date").value;TIME="";document.getElementById("sd").textContent=DATE;document.getElementById("st").textContent="—";if(P.closedDates?.[DATE]?.closed){document.getElementById("times").innerHTML='<p class="muted">La peluquería no trabaja este día.</p>';return}if(P.professionalAbsences?.[PRO]?.[DATE]?.absent){document.getElementById("times").innerHTML='<p class="muted">Este profesional no trabaja ese día.</p>';return}const d=(await db.ref(`negocios/${UID}/turnos`).once("value")).val()||{},occ=Object.values(d).filter(x=>x.status!=="cancelled"&&x.dateStr===DATE&&(x.professionalId===PRO||x.barber===P.professionals?.[PRO]?.name)).map(x=>x.time);document.getElementById("times").innerHTML=allowed(DATE).map(t=>occ.includes(t)?`<button class="time busy" disabled>${t}</button>`:`<button class="time" onclick="pick('${t}',this)">${t}</button>`).join("")}
function pick(t,e){document.querySelectorAll(".time").forEach(x=>x.classList.remove("sel"));e.classList.add("sel");TIME=t;document.getElementById("st").textContent=t+" hs"}
function clientForm(){if(!SVC||!PRO||!DATE||!TIME)return alert("Completá servicio, profesional, fecha y horario.");document.getElementById("mc").innerHTML=`<h2>Confirmar turno</h2><div class="field"><label>Nombre y apellido</label><input id="cn"></div><div class="field"><label>Celular</label><input id="cp"></div><button class="btn primary" style="width:100%;margin-top:14px" onclick="save()">Confirmar reserva</button>`;document.getElementById("modal").classList.add("open")}
async function save(){const n=document.getElementById("cn").value.trim(),p=document.getElementById("cp").value.trim();if(!n||!p)return alert("Completá tus datos.");const data=(await db.ref(`negocios/${UID}/turnos`).once("value")).val()||{},collision=Object.values(data).some(x=>x.status!=="cancelled"&&x.dateStr===DATE&&x.time===TIME&&(x.professionalId===PRO||x.barber===P.professionals?.[PRO]?.name));if(collision){document.getElementById("modal").classList.remove("open");alert("Ese horario acaba de ocuparse.");times();return}const key=db.ref(`negocios/${UID}/turnos`).push().key,s=P.services[SVC],b=P.branches[BR],pr=P.professionals[PRO];await db.ref(`negocios/${UID}/turnos/${key}`).set({key,patient:n,phone:p,dateStr:DATE,time:TIME,service:s.name,totalPrice:Number(s.price||0),branchId:BR,branchName:b.name,professionalId:PRO,professionalName:pr.name,barber:pr.name,status:"reserved",createdAt:Date.now(),source:"public_link"});const msg=encodeURIComponent(`CONFIRMACIÓN DE TURNO - ${P.name}\nCliente: ${n}\nTeléfono: ${p}\nSucursal: ${b.name}\nProfesional: ${pr.name}\nServicio: ${s.name}\nFecha: ${DATE}\nHora: ${TIME} hs`);document.getElementById("mc").innerHTML=`<div style="text-align:center"><div style="font-size:48px;color:var(--a)">✓</div><h2>¡Reserva confirmada!</h2><p class="muted">El turno ya quedó guardado.</p><button class="btn gold" style="width:100%;margin-top:14px" onclick="window.open('https://wa.me/${esc(P.phone||"")}?text=${msg}','_blank');document.getElementById('modal').classList.remove('open');render()">Enviar por WhatsApp</button></div>`}
const slug=new URLSearchParams(location.search).get("negocio");slug?load(slug):home();
</script></body></html>
